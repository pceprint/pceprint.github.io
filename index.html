<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos Bancarios - PCE Print</title>
<style>
  body {
    background: #0833A2;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 30px 20px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  .logo {
    width: 250px;
    height: 112.5px;
    object-fit: contain; 
    border-radius: 12%;
    margin-bottom: 15px;
    background: white;
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
  }
  h1 {
    font-size: 24px;
    margin: 10px 0 5px;
    color: #0833A2;
  }
  .datos {
    font-size: 14px;
    color: #0833A2;
    margin-bottom: 25px;
    line-height: 1.6;
  }
  .btn {
    background: white;
    color: black;
    border: none;
    border-radius: 8px;
    padding: 5px 12px;
    margin: 0; /*auto izquierda y derecha = centrado*/
    display: block
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    width: fit-content;
    min-width: 0;
    margin-left: auto:
    flex-shrink: 0;
    transition: 0.2s;
}
  .tipo-cuenta {
    font-size: 15px;
    color: #0833A2;
    margin: 25px 0 10px 5px;
    font-weight: 700;
    text-align: left;
}
  }
  .btn:hover {
    background: #2a2a2a;
    border-color: #00d4ff;
  }

  .banco {
    display: flex;
    align-items: center;
    justify-content: space-between;  /* Empuja log izq y boton der*/
    gap: 15px;
    padding: 12px;
    border: 1px solid rgba (255, 255, 255, 0.15);
    border-radius: 15px;
    margin-bottom: 12px;
    background: rgba(0, 0, 0, 0.25);
}

.banco img {
    width: 55px;        
    height: 55px;
    object-fit: contain;
    border-radius: 12px;
}

.btn {
    background: white;   
    color: black;
    border: none;
    border-radius: 50px;
    padding: 14px 12px;
    font-weight: bold;
    font-size: 16px;
    flex: 1;
    cursor: pointer;
}

.btn:active {
    background: #e0e0e0;
}
  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>
<div class="card">
  <img src="logo.png" alt="Logo" class="logo">
  
  <h1>DATOS BANCARIOS</h1>
  
  <div class="datos">
    RNC: 131835945<br>
    Titular: Yessica Castro Estevez<br>
    Cédula: 22301491415
  </div>

<div class="banco">
  <img src="popular.png" alt="Popular">
  <button class="btn" onclick="copiar('832264428')">Copiar cuenta</button> 
</div>

 <div class="banco">
  <img src="bhd.png" alt="BHD">
  <button class="btn" onclick="copiar('29999070016')">Copiar cuenta</button> 
</div>

  <p class="tipo-cuenta">Cuentas personales</p>
  <div class="banco">
  <img src="banreservas.png" alt="Banreservas">
  <button class="btn" onclick="copiar('9603469721')">Copiar cuenta</button>
</div>

  <div class="banco">
  <img src="lanacional.png" alt="La nacional">
  <button class="btn" onclick="copiar('1460338193')">Copiar cuenta</button>
</div>

  <div class="footer">Rápido y Seguro con un Toque 🔒</div>
</div>

<script>
function copiar(numero) {
  navigator.clipboard.writeText(numero);
  alert('Cuenta copiada ✅');
}
</script>
</body>
</html>
