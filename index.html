<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos Bancarios - PCE Print</title>
<style>
  body {
    background: #0a0a0a;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #111;
    border-radius: 20px;
    padding: 30px 20px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  .logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-bottom: 15px;
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
  }
  h1 {
    font-size: 24px;
    margin: 10px 0 5px;
    color: #00d4ff;
  }
  .datos {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 25px;
    line-height: 1.6;
  }
  .btn {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 15px;
    margin: 10px 0;
    display: flex;
    align-items: center;
    gap: 15px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn:hover {
    background: #2a2a2a;
    border-color: #00d4ff;
  }
  .btn img {
    width: 40px;
    height: 40px;
    border-radius: 8px;
  }
  .btn span {
    font-size: 16px;
    font-weight: bold;
  }
  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>
<div class="card">
  <img src="logo.png" alt="Logo" class="logo">
  
  <h1>DATOS BANCARIOS</h1>
  
  <div class="datos">
    RNC: 131835945<br>
    Titular: Yessica Castro Estevez<br>
    Cédula: 22301491415
  </div>

  <button class="btn" onclick="copiar('832264482')">
    <img src="popular.png" alt="Popular">
    <span>Copiar cuenta</span>
  </button>

  <button class="btn" onclick="copiar('29999070016')">
    <img src="bhd.png" alt="BHD">
    <span>Copiar cuenta</span>
  </button>

  <button class="btn" onclick="copiar('9603469721')">
    <img src="banreservas.png" alt="Banreservas">
    <span>Copiar cuenta</span>
  </button>

  <button class="btn" onclick="copiar('1460338193')">
    <img src="lanacional.png" alt="La Nacional">
    <span>Copiar cuenta</span>
  </button>

  <div class="footer">Rápido y Seguro con un Toque 🔒</div>
</div>

<script>
function copiar(numero) {
  navigator.clipboard.writeText(numero);
  alert('Cuenta copiada ✅');
}
</script>
</body>
</html>
