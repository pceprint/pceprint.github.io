<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos de Pago - PCE Print</title>
  <style>
    body { background:#0a0a0a; color:#fff; font-family:Arial; text-align:center; padding:40px 20px; margin:0; }
    .card { max-width:400px; margin:auto; background:#1a1a1a; padding:30px; border-radius:20px; border:1px solid #333; }
    h1 { color:#00d4ff; font-size:28px; margin-bottom:10px; }
    p { color:#aaa; margin-bottom:25px; }
    .btn { background:#00d4ff; color:#000; padding:15px; border:none; border-radius:12px; font-weight:bold; cursor:pointer; margin:8px 0; width:100%; font-size:16px; display:flex; align-items:center; gap:10px; }
    .btn img { height:24px; }
    .btn:active { background:#00a3cc; }
    .footer { margin-top:30px; font-size:12px; color:#666; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DATOS DE PAGO</h1>
    <p>Rápido y Seguro con un toque 🔒</p>
    
    <button class="btn" onclick="copiar('832264428')">
      <img src="popular.png"> Popular: 832264428
    </button>
    <button class="btn" onclick="copiar('29999070016')">
      <img src="bhd.png"> BHD: 29999070016
    </button>
    <button class="btn" onclick="copiar('9603469721')">
      <img src="banreservas.png"> Banreservas: 9603469721
    </button>
    <button class="btn" onclick="copiar('1460338193')">
      <img src="lanacional.png"> La Nacional: 1460338193
    </button>
    
    <div class="footer">
      Titular: Yessica Castro Estevez<br>
      PCE Print
    </div>
  </div>
  
  <script>
    function copiar(num) {
      navigator.clipboard.writeText(num);
      alert('✅ Cuenta copiada: ' + num);
    }
  </script>
</body>
</html>
